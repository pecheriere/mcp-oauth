[advisories]
ignore = [
    # basic-toml is archived. askama_derive (0.15 and 0.16) uses it at compile
    # time only, to read askama's optional config file; it is not linked into
    # the library or anything built with it. Remove once askama drops it.
    { id = "RUSTSEC-2026-0374", reason = "compile-time only, via askama_derive; no maintained askama release avoids it" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
