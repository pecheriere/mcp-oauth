version: 2

# Version updates wait until a release is 7 days old, the age the crate-age
# check and the action pinning rule require, and minor and patch updates come
# grouped into one pull request per ecosystem. Security updates skip the
# cooldown and come one per advisory; a crate release younger than 7 days that
# fixes an advisory still needs an entry in .github/crate-age-allow.toml.
#
# cargo and pip patch and minor updates merge by themselves once their checks
# pass (.github/workflows/dependabot-automerge.yml). Main requires branches to
# be up to date, and Dependabot does not rebase a pull request that is only
# behind main, so each ecosystem runs on its own day and a merge rarely leaves
# another pull request behind. Security updates ignore the schedule; a pull
# request that does fall behind needs its branch updated by hand.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 14
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # The ruff version the crate-age job lints its scripts with, pinned by hash
  # in .github/requirements-lint.txt.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
