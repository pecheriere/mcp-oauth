name: dependency-review

# Fails a pull request that adds a dependency or action version with a known
# vulnerability, using GitHub's advisories. Those can include advisories that
# the RustSec database behind cargo deny does not have yet.

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
