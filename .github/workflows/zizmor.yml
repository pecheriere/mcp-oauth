name: zizmor

# Static analysis of the GitHub Actions workflows and the Dependabot config:
# unpinned actions, template injection, excessive permissions, credential
# persistence, cache poisoning. Any finding fails the job, which is a required
# check. Results are printed in the log rather than uploaded as SARIF, so the
# check also works on pull requests from forks, whose token cannot write to the
# Security tab.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
